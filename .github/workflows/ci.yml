name: Warm macOS release cache

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-release-cache:
    # Default-branch caches can be restored by future release tags.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_TERM_COLOR: always
      MI_CLIP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release-${{ matrix.arch }}
      - name: Warm protocol, analytics and updater tests
        run: cargo test --locked --no-default-features --features research,analytics --lib
      - name: Warm optimized release dependencies
        # Preserve the release script's encoded path-remapping Rust flags.
        run: sh tools/build-release.sh --bin mi-clip
      - name: Validate native share app packaging
        run: MI_CLIP_SKIP_BUILD=1 sh tools/build-app.sh
      - name: Verify first-launch Share extension registration
        run: python3 tests/share_registration_test.py target/app/Clip.app
      - name: Verify native share picker and transfer progress
        run: python3 tests/share_ui_test.py target/app/Clip.app
      - name: Verify capture stitching, annotations and shortcut conflicts
        run: python3 tests/capture_test.py
